server:
  port: 0

spring:
  application:
    name: ms-auth-test

  datasource:
    url: jdbc:tc:postgresql:16-alpine:///eventpass_auth_test
    username: test
    password: test

  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      ssl:
        enabled: false
      timeout: 2000ms

