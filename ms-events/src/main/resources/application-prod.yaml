server:
  port: ${PORT:8082}

spring:
  flyway:
    enabled: true
  datasource:
    url: ${EVENTS_DB_URL}
    username: ${EVENTS_DB_USERNAME}
    password: ${EVENTS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  cloud:
    aws:
      region:
        static: ${AWS_REGION}

app:
  sqs:
    queues:
      event-published: ${EVENT_PUBLISHED_QUEUE:eventpass-events-published-queue}
      event-cancelled: ${EVENT_CANCELLED_QUEUE:eventpass-events-cancelled-queue}
