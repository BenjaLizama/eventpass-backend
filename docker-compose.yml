version: '3.8'

services:
  postgres-auth:
    image: postgres:16-alpine
    container_name: eventpass-postgres-auth
    restart: always
    environment:
      POSTGRES_DB: eventpass_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: eventpass-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_auth_data:
  redis_data: