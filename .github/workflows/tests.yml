name: Run tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest

    outputs:
      ms-auth: ${{ steps.filter.outputs.ms-auth }}
      ms-orders: ${{ steps.filter.outputs.ms-orders }}
      ms-events: ${{ steps.filter.outputs.ms-events }}
      ms-tickets: ${{ steps.filter.outputs.ms-tickets }}
      e2e: ${{ steps.filter.outputs.e2e }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Detect changed services
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ms-auth:
              - 'ms-auth/**'
              - '.github/workflows/**'
            ms-orders:
              - 'ms-orders/**'
              - '.github/workflows/**'
            ms-events:
              - 'ms-events/**'
              - '.github/workflows/**'
            ms-tickets:
              - 'ms-tickets/**'
              - '.github/workflows/**'
            e2e:
              - 'ms-auth/**'
              - 'ms-events/**'
              - 'ms-orders/**'
              - 'ms-tickets/**'
              - 'e2e-tests/**'
              - 'docker-compose.yml'
              - 'scripts/**'
              - 'infra/**'
              - '.env.example'
              - '.github/workflows/**'

  ms-auth-tests:
    name: ms-auth Tests
    needs: changes
    if: needs.changes.outputs.ms-auth == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ms-auth/pom.xml

      - name: Run ms-auth tests
        working-directory: ms-auth
        run: ./mvnw clean test

  ms-orders-tests:
    name: ms-orders Tests
    needs: changes
    if: needs.changes.outputs.ms-orders == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ms-orders/pom.xml

      - name: Run ms-orders tests
        working-directory: ms-orders
        run: ./mvnw clean test

  ms-events-tests:
    name: ms-events Tests
    needs: changes
    if: needs.changes.outputs.ms-events == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ms-events/pom.xml

      - name: Run ms-events tests
        working-directory: ms-events
        run: ./mvnw clean test

  ms-tickets-tests:
    name: ms-tickets Tests
    needs: changes
    if: needs.changes.outputs.ms-tickets == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ms-tickets/pom.xml

      - name: Run ms-tickets tests
        working-directory: ms-tickets
        run: ./mvnw clean test

  e2e-tests:
    name: Platform E2E Tests
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest

    env:
      E2E_ADMIN_EMAIL: admin@eventpass.cl
      E2E_ADMIN_PASSWORD: Cambiame123!

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: e2e-tests/pom.xml

      - name: Create local test environment
        run: cp .env.example .env

      - name: Start platform
        run: docker compose --env-file .env up -d --build

      - name: Wait for services
        run: |
          for i in {1..60}; do
            if docker compose ps | grep -q "ms-auth.*healthy" &&
               docker compose ps | grep -q "ms-events.*healthy" &&
               docker compose ps | grep -q "ms-orders.*healthy" &&
               docker compose ps | grep -q "ms-tickets.*healthy"; then
              echo "All services are healthy"
              exit 0
            fi

            echo "Waiting for healthy services ($i/60)"
            sleep 5
          done

          docker compose ps
          docker compose logs --tail=200
          exit 1

      - name: Run E2E tests
        env:
          MS_ORDERS_CLIENT_ID: eventpass-ms-orders
          MS_ORDERS_CLIENT_SECRET: eventpass-local-demo-secret
        run: >
          ./ms-auth/mvnw -f e2e-tests/pom.xml
          "-Dit.test=PlatformHealthIT,SecurityBoundariesIT,OrganizerOwnershipIT,EventPassPurchaseFlowIT,OrderCancellationRestoresCapacityIT,OrderPerUserLimitIT,OrderInsufficientCapacityIT,TicketAccessControlIT,OrderItemCapacityIT"
          verify

      - name: Test Swagger and API Gateway in private mode
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($target in @(
            @{ port = 8082; path = '/api/v1/events' },
            @{ port = 8082; path = '/api/v1/events/my-events' },
            @{ port = 8082; path = '/api/v1/venues' },
            @{ port = 8083; path = '/api/v1/orders/my-orders' }
          )) {
            $individual = Invoke-RestMethod "http://127.0.0.1:$($target.port)/v3/api-docs"
            $query = $individual.paths.($target.path).get.parameters.name
            if ($query -contains 'pageable' -or $query -contains 'sort' -or $query -notcontains 'page' -or $query -notcontains 'size') {
              throw "Paginación incorrecta en $($target.path)."
            }
          }
          $demo = ./infra/gateway/start-local-demo.ps1 -SmokeTest
          $base = $demo.Swagger.TrimEnd('/')
          $spec = Invoke-RestMethod "$base/openapi.json" -TimeoutSec 30
          $parameters = $spec.paths.'/api/v1/events'.get.parameters.name
          if ($parameters -contains 'pageable' -or $parameters -notcontains 'page' -or $parameters -notcontains 'size') {
            throw 'La paginación del catálogo debe documentar page y size por separado.'
          }
          $catalog = Invoke-RestMethod "$base/api/v1/events?page=0&size=5"
          if ($catalog.status -ne 200) { throw 'El catálogo no respondió a través de Swagger y Floci.' }
          foreach ($service in 'ms-auth', 'ms-events', 'ms-orders', 'ms-tickets') {
            $id = docker compose ps -q $service
            $container = docker inspect $id | ConvertFrom-Json
            $bindings = $container.NetworkSettings.Ports.PSObject.Properties |
              Where-Object { $_.Value }
            if ($bindings) {
              throw "$service tiene puertos publicados en el host."
            }
          }
          $env:AUTH_BASE_URL = $env:EVENTS_BASE_URL = $env:ORDERS_BASE_URL = $env:TICKETS_BASE_URL = $base
          ./ms-auth/mvnw -B -f e2e-tests/pom.xml '-Dit.test=*,!PlatformHealthIT,!OrderItemCapacityIT' verify

      - name: Test SQS and Lambda with Floci
        shell: pwsh
        run: ./infra/lambda-smoke/test-local-lambda.ps1

      - name: Test asynchronous purchases and dead-letter recovery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./infra/purchase-lambda/start-local-purchase.ps1 -VisibilityTimeout 25 -MaxReceiveCount 2
          $env:E2E_ASYNC_PURCHASE = 'true'
          $env:E2E_INTERRUPT_TICKETS = 'true'
          $env:E2E_PURCHASE_DLQ = 'true'
          $env:AUTH_BASE_URL = $env:EVENTS_BASE_URL = $env:ORDERS_BASE_URL = $env:TICKETS_BASE_URL = 'http://127.0.0.1:8090'
          ./ms-auth/mvnw -B -f e2e-tests/pom.xml '-Dit.test=EventPassPurchaseFlowIT,TicketAccessControlIT' verify

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=300
          docker logs --tail=100 eventpass-gateway-floci-gateway-1 || true
          docker logs --tail=100 eventpass-gateway-swagger-1 || true

  deployment-checks:
    name: Production Profiles and Deployment Definitions
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    env:
      E2E_ADMIN_EMAIL: admin@eventpass.cl
      E2E_ADMIN_PASSWORD: Cambiame123!
      MS_ORDERS_CLIENT_ID: eventpass-ms-orders
      MS_ORDERS_CLIENT_SECRET: eventpass-local-demo-secret
      E2E_CHECK_TICKET_REPLAY: 'true'
      AUTH_BASE_URL: http://127.0.0.1:18081
      EVENTS_BASE_URL: http://127.0.0.1:18082
      ORDERS_BASE_URL: http://127.0.0.1:18083
      TICKETS_BASE_URL: http://127.0.0.1:18084
      COMPOSE_PROJECT_NAME: eventpass-dynamo-verify
      COMPOSE_FILE: docker-compose.yml:infra/gateway/compose.private.yaml:infra/database/compose.verify.yaml:infra/database/compose.dynamodb.yaml
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: e2e-tests/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Lambda and render ECS task definitions
        run: |
          node --test infra/purchase-lambda/*.test.mjs
          node --test infra/aws/*.test.mjs
          node infra/aws/render-task-definitions.mjs infra/aws/task-config.example.json "$RUNNER_TEMP/eventpass-tasks"
          for service in auth events orders tickets; do
            jq -e --arg family "eventpass-ms-$service" '
              .family == $family and .networkMode == "awsvpc"
              and (.containerDefinitions[0].secrets | any(.name == "JWT_SECRET"))
              and (.containerDefinitions[0].environment | all(.name != "JWT_SECRET"))
            ' "$RUNNER_TEMP/eventpass-tasks/ms-$service.json"
          done
      - name: Test lab initialization and recovery without AWS credentials
        shell: pwsh
        run: |
          ./infra/aws/test-lab-initialization.ps1
          ./infra/aws/test-lab-recovery.ps1
          ./infra/aws/test-runner-adapter.ps1
      - name: Build private database verification image
        run: docker build -t eventpass-data-bootstrap:ci infra/aws/data-bootstrap
      - name: Build and test Java Gateway authorizer image
        run: |
          docker build --platform linux/amd64 --provenance=false -t eventpass-gateway-authorizer:ci infra/gateway-authorizer
          docker run --rm --network none --read-only --tmpfs /tmp --entrypoint /bin/sh eventpass-gateway-authorizer:ci -c 'test "$(id -u)" -gt 0'
      - name: Build and test purchase Lambda Docker image
        run: |
          docker build --platform linux/amd64 --provenance=false -t eventpass-purchase:ci infra/purchase-lambda
          docker run --rm --network none --read-only --tmpfs /tmp --entrypoint /var/lang/bin/node eventpass-purchase:ci \
            -e 'if (process.getuid() === 0) throw Error("Lambda runs as root"); await import("@aws-sdk/client-secrets-manager");'
          docker run --rm --network none --read-only --tmpfs /tmp \
            --mount "type=bind,source=$PWD/infra/purchase-lambda/index.test.mjs,target=/var/task/index.test.mjs,readonly" \
            --entrypoint /var/lang/bin/node eventpass-purchase:ci --test /var/task/index.test.mjs
      - name: Start with empty databases and DynamoDB Local
        run: |
          cp .env.example .env
          docker compose up -d --wait localstack dynamodb
          docker compose exec -T localstack aws --endpoint-url http://dynamodb:8000 dynamodb create-table --cli-input-json file:///etc/eventpass/tickets-table.json
          docker compose up -d --build --wait --wait-timeout 240
          for database in auth events orders; do
            docker compose exec -T "postgres-$database" sh -c '
              psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT version, success FROM flyway_schema_history;" | grep -Fx "1|t"
            '
          done
      - name: Verify application containers run without root
        run: |
          for service in ms-auth ms-events ms-orders ms-tickets; do
            uid=$(docker compose exec -T "$service" id -u)
            test "$uid" -gt 0 || { echo "$service runs as root"; exit 1; }
            echo "$service runs as UID $uid"
          done
      - name: Run E2E tests with DynamoDB
        run: ./ms-auth/mvnw -B -f e2e-tests/pom.xml verify
      - name: Show deployment-check logs
        if: failure()
        run: docker compose logs --tail=100

  swarm-checks:
    name: Docker Swarm manager, worker and scaling
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: e2e-tests/pom.xml
      - name: Build, deploy and scale four services on two isolated Docker nodes
        shell: pwsh
        run: ./infra/swarm/test-swarm.ps1 -KeepRunning
      - name: Verify purchases and ticket access over Swarm
        env:
          AUTH_BASE_URL: http://127.0.0.1:18081
          EVENTS_BASE_URL: http://127.0.0.1:18082
          ORDERS_BASE_URL: http://127.0.0.1:18083
          TICKETS_BASE_URL: http://127.0.0.1:18084
          E2E_ADMIN_EMAIL: admin@eventpass.cl
          E2E_ADMIN_PASSWORD: Cambiame123!
          MS_ORDERS_CLIENT_ID: eventpass-ms-orders
          MS_ORDERS_CLIENT_SECRET: eventpass-local-demo-secret
        run: >-
          ./ms-auth/mvnw -B -f e2e-tests/pom.xml
          '-Dit.test=PlatformHealthIT,SecurityBoundariesIT,OrganizerOwnershipIT,EventPassPurchaseFlowIT,OrderCancellationRestoresCapacityIT,TicketAccessControlIT'
          verify
      - name: Verify Swarm scaling under concurrent read load
        # Load is read-only and bounded; it also checks continuity while scaling in/out.
        if: success()
        run: node infra/swarm/test-scaling.mjs
      - name: Save Swarm evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-verification
          path: |
            .local/swarm/verification.json
            .local/swarm/scaling-load.json
      - name: Stop isolated Swarm nodes
        if: always()
        run: docker compose -p eventpass-swarm-lab -f infra/swarm/compose.lab.yaml down

  deploy-aws:
    name: Deploy tested develop to Learner Lab
    needs: [ms-auth-tests, ms-events-tests, ms-orders-tests, ms-tickets-tests, e2e-tests, deployment-checks, swarm-checks]
    if: >-
      always() && !cancelled() && !failure() &&
      github.event_name == 'push' && github.ref == 'refs/heads/develop' &&
      vars.AWS_DEPLOY_ENABLED == 'true' &&
      needs.e2e-tests.result == 'success' && needs.deployment-checks.result == 'success' &&
      needs.swarm-checks.result == 'success'
    uses: ./.github/workflows/deploy-aws.yml
    secrets: inherit
