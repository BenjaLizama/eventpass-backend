server:
  port: ${PORT:8083}

spring:
  datasource:
    url: ${EVENTS_DB_URL}
    username: ${EVENTS_DB_USERNAME}
    password: ${EVENTS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect