name: Run tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest

    outputs:
      ms-auth: ${{ steps.filter.outputs.ms-auth }}
      ms-orders: ${{ steps.filter.outputs.ms-orders }}
      ms-events: ${{ steps.filter.outputs.ms-events }}
      ms-tickets: ${{ steps.filter.outputs.ms-tickets }}
      e2e: ${{ steps.filter.outputs.e2e }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Detect changed services
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ms-auth:
              - 'ms-auth/**'
              - '.github/workflows/tests.yml'
            ms-orders:
              - 'ms-orders/**'
              - '.github/workflows/tests.yml'
            ms-events:
              - 'ms-events/**'
              - '.github/workflows/tests.yml'
            ms-tickets:
              - 'ms-tickets/**'
              - '.github/workflows/tests.yml'
            e2e:
              - 'ms-auth/**'
              - 'ms-events/**'
              - 'ms-orders/**'
              - 'ms-tickets/**'
              - 'e2e-tests/**'
              - 'docker-compose.yml'
              - 'scripts/**'
              - 'infra/**'
              - '.env.example'
              - '.github/workflows/tests.yml'

  ms-auth-tests:
    name: ms-auth Tests
    needs: changes
    if: needs.changes.outputs.ms-auth == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ms-auth/pom.xml

      - name: Run ms-auth tests
        working-directory: ms-auth
        run: ./mvnw clean test

  ms-orders-tests:
    name: ms-orders Tests
    needs: changes
    if: needs.changes.outputs.ms-orders == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ms-orders/pom.xml

      - name: Run ms-orders tests
        working-directory: ms-orders
        run: ./mvnw clean test

  ms-events-tests:
    name: ms-events Tests
    needs: changes
    if: needs.changes.outputs.ms-events == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ms-events/pom.xml

      - name: Run ms-events tests
        working-directory: ms-events
        run: ./mvnw clean test

  ms-tickets-tests:
    name: ms-tickets Tests
    needs: changes
    if: needs.changes.outputs.ms-tickets == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ms-tickets/pom.xml

      - name: Run ms-tickets tests
        working-directory: ms-tickets
        run: ./mvnw clean test

  e2e-tests:
    name: Platform E2E Tests
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest

    env:
      E2E_ADMIN_EMAIL: admin@eventpass.cl
      E2E_ADMIN_PASSWORD: Cambiame123!

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: e2e-tests/pom.xml

      - name: Create local test environment
        run: cp .env.example .env

      - name: Start platform
        run: docker compose --env-file .env up -d --build

      - name: Wait for services
        run: |
          for i in {1..60}; do
            if docker compose ps | grep -q "ms-auth.*healthy" &&
               docker compose ps | grep -q "ms-events.*healthy" &&
               docker compose ps | grep -q "ms-orders.*healthy" &&
               docker compose ps | grep -q "ms-tickets.*healthy"; then
              echo "All services are healthy"
              exit 0
            fi

            sleep 5
          done

          docker compose ps
          docker compose logs --tail=200
          exit 1

      - name: Run E2E tests
        env:
          MS_ORDERS_CLIENT_ID: eventpass-ms-orders
          MS_ORDERS_CLIENT_SECRET: eventpass-local-demo-secret
        run: >
          ./ms-auth/mvnw -f e2e-tests/pom.xml
          "-Dit.test=PlatformHealthIT,EventPassPurchaseFlowIT,OrderCancellationRestoresCapacityIT,OrderPerUserLimitIT,OrderInsufficientCapacityIT,TicketAccessControlIT,OrderItemCapacityIT"
          verify

      - name: Test Swagger and API Gateway in private mode
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($target in @(
            @{ port = 8082; path = '/api/v1/events' },
            @{ port = 8082; path = '/api/v1/events/my-events' },
            @{ port = 8082; path = '/api/v1/venues' },
            @{ port = 8083; path = '/api/v1/orders/my-orders' }
          )) {
            $individual = Invoke-RestMethod "http://127.0.0.1:$($target.port)/v3/api-docs"
            $query = $individual.paths.($target.path).get.parameters.name
            if ($query -contains 'pageable' -or $query -contains 'sort' -or $query -notcontains 'page' -or $query -notcontains 'size') {
              throw "Paginación incorrecta en $($target.path)."
            }
          }
          $demo = ./infra/gateway/start-local-demo.ps1 -SmokeTest
          $base = $demo.Swagger.TrimEnd('/')
          $spec = Invoke-RestMethod "$base/openapi.json" -TimeoutSec 30
          $parameters = $spec.paths.'/api/v1/events'.get.parameters.name
          if ($parameters -contains 'pageable' -or $parameters -notcontains 'page' -or $parameters -notcontains 'size') {
            throw 'La paginación del catálogo debe documentar page y size por separado.'
          }
          $catalog = Invoke-RestMethod "$base/api/v1/events?page=0&size=5"
          if ($catalog.status -ne 200) { throw 'El catálogo no respondió a través de Swagger y Floci.' }
          foreach ($service in 'ms-auth', 'ms-events', 'ms-orders', 'ms-tickets') {
            $id = docker compose ps -q $service
            $container = docker inspect $id | ConvertFrom-Json
            $bindings = $container.NetworkSettings.Ports.PSObject.Properties |
              Where-Object { $_.Value }
            if ($bindings) {
              throw "$service tiene puertos publicados en el host."
            }
          }
          $env:AUTH_BASE_URL = $env:EVENTS_BASE_URL = $env:ORDERS_BASE_URL = $env:TICKETS_BASE_URL = $base
          ./ms-auth/mvnw -B -f e2e-tests/pom.xml '-Dit.test=*,!PlatformHealthIT,!OrderItemCapacityIT' verify

      - name: Test SQS and Lambda with Floci
        shell: pwsh
        run: ./infra/lambda-smoke/test-local-lambda.ps1

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=300
          docker logs --tail=100 eventpass-gateway-floci-gateway-1 || true
          docker logs --tail=100 eventpass-gateway-swagger-1 || true
